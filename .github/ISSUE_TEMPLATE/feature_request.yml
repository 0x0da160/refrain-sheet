name: 機能要望 / Feature request
description: やりたいことを一言で。Claudeが実装用に整理します。 / Say what you want in one line; Claude works out the implementation.
labels: ['agent:triage', 'type:feature']
body:
  - type: markdown
    attributes:
      value: |
        タイトルと「やりたいこと」だけ書けば十分です。背景・受け入れ基準・技術設計・テスト計画・リスク・ロールバックなどは、Claudeが内容を読み取り、不足があれば質問します。
        Just fill in the title and “やりたいこと”. Background, acceptance criteria, technical design, test plan, risk, and rollback are inferred by Claude, which asks when something is missing.

        タイトルの例 / Title example: `検索結果に並び替え機能を追加したい`

        機密情報・認証情報・トークンは記載しないでください。/ Do not include secrets, credentials, or tokens.

  - type: textarea
    id: what
    attributes:
      label: やりたいこと
      description: 実現したいことを自由に書いてください。短文でも構いません。Claudeが実装用に整理します。
      placeholder: '例: 検索結果を新着順と人気順で切り替えられるようにしたい'
    validations:
      required: true

  # Optional acknowledgement. NOTE: GitHub Issue Forms render checkboxes
  # unchecked and provide no "default checked" attribute, so this cannot be
  # pre-ticked; it is optional (required: false) and purely informational.
  - type: checkboxes
    id: ack
    attributes:
      label: 確認
      options:
        - label: Claudeが内容を整理し、不足や危険な変更は質問・停止する場合があることを理解しました
          required: false
