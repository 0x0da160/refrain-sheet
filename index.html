<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `worker-src blob:` and `connect-src blob:` exist only for the
         @wllama/wllama local-assistant engine (src/app/llm/wllama-engine.ts),
         which instantiates its inference Worker from a `Blob` built in
         memory from its own bundled source (never fetched) and then reads
         its WASM binary and the GGUF model back out of `blob:` URLs this app
         itself creates from embedded, integrity-verified bytes — see
         docs/llm-model.md and docs/security.md. `blob:`/`data:` are local,
         in-memory schemes, never a real network origin, so this keeps the
         "no runtime network access" guarantee: no `http:`/`https:` origin is
         ever reachable. `scripts/check-dist.mjs` asserts this precisely. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file: 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' file:; img-src 'self' file: data:; font-src 'self' file:; connect-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <!-- SVG favicon copied verbatim from public/ to the dist root. The
         relative "/favicon.svg" reference is rewritten to "./favicon.svg" by
         Vite's base:'./' so it resolves under a GitHub Pages base path and when
         dist/index.html is opened directly via file://; no network request. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Refrain Sheet — A local-first, format-preserving CSV and spreadsheet editor</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Refrain Sheet requires JavaScript. It runs fully offline; no data leaves this page.</noscript>
  </body>
</html>
