# Pins the Rust toolchain for wasm/ (refrain-csv-core) everywhere rustup is
# used: local builds, the Docker image, and CI. The embedded WASM payload in
# src/wasm-gen/ is only byte-reproducible with this exact toolchain (plus
# wasm-pack 0.15.0 and wasm-bindgen-cli 0.2.129), which .github/workflows/wasm.yml
# verifies. Keep in sync with the Dockerfile and .claude/hooks/session-start.sh.
# Stay on a stable release still inside the supported window recorded in
# supply-chain/eol.json (npm run check:eol).
[toolchain]
channel = "1.98.1"
profile = "minimal"
targets = ["wasm32-unknown-unknown"]
