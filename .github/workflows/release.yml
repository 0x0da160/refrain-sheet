name: Release

# Releases AND the GitHub Pages deployment are created ONLY when a strict
# semantic-version tag (vMAJOR.MINOR.PATCH, e.g. v0.1.1) is pushed. Ordinary
# pushes to main, pull requests, non-version tags, and malformed tags never
# reach this workflow (the tag filter is numeric) and, as defense in depth,
# would still be rejected by the "Validate tag format" step below. The PR/main
# checks live in ci.yml.
#
# This workflow is ALSO callable (`workflow_call`) so that a manual release can
# execute these exact steps instead of duplicating them. There is one release
# implementation, not two. `manual-release.yml` is the only caller. The tag-push
# path is unchanged: every step below reads `inputs.tag || github.ref_name`, which
# on a tag push is exactly the pushed tag it always was.
on:
  push:
    tags:
      # GitHub tag filter glob: [0-9]+ = one or more digits, '.' is literal.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'Exact vX.Y.Z tag to release. Must already exist and be reachable from the default branch.'
        required: true
        type: string
    outputs:
      release_url:
        description: 'URL of the published GitHub Release.'
        value: ${{ jobs.release.outputs.release_url }}
      page_url:
        description: 'URL of the GitHub Pages deployment.'
        value: ${{ jobs.deploy-pages.outputs.page_url }}

# Least privilege by default: read-only. Each job widens only what it needs.
permissions:
  contents: read

# Releases are serialized repository-wide so two of them can never bump, tag, or
# publish at the same time — and a release in progress is NEVER cancelled.
#
# On a tag push this is the shared `production-release` group, the same group
# `manual-release.yml` holds. When this workflow is CALLED, the caller already
# holds that group; taking it again here would deadlock the run against itself,
# so the called instance uses a group unique to the run instead. `github.event_name`
# inside a called workflow is the caller's event, which is what distinguishes the
# two cases.
concurrency:
  group: ${{ github.event_name == 'push' && 'production-release' || format('production-release-call-{0}', github.run_id) }}
  cancel-in-progress: false

# Action-pinning policy (see docs/security.md): every action here is an official
# GitHub-maintained actions/* pinned to a major version tag; any third-party
# (non actions/*) action would instead be pinned to a full commit SHA.

jobs:
  release:
    runs-on: ubuntu-latest
    # The release job gets the narrowest write set it needs: write access to
    # repository contents (to publish the GitHub Release assets), plus OIDC
    # id-token and attestations write (to produce a signed build-provenance
    # attestation for the release ZIP). It also builds the static site and
    # uploads it as the Pages artifact for the deploy-pages job to publish.
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' does not match v<major>.<minor>.<patch>" >&2
            exit 1
          fi

      # Always check out the exact tag being released. On a tag push that is what
      # checkout would do by default; when called, the caller's ref would otherwise
      # be used, so naming it here is what keeps both paths building the same tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "$TAG" ]; then
            echo "Tag '$TAG' does not match package.json version 'v${PKG_VERSION}'." >&2
            echo "The application version is defined once in package.json." >&2
            exit 1
          fi

      # `npm ci --ignore-scripts` reproduces node_modules strictly from the
      # committed lockfile (and fails if it disagrees with package.json —
      # lockfile integrity), while blocking dependency lifecycle scripts on the
      # release path.
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      # Belt-and-suspenders version gate: package.json ⇄ package-lock.json ⇄ tag.
      - name: Version consistency (package.json / lockfile / tag)
        run: npm run check:versions -- --tag "${{ inputs.tag || github.ref_name }}"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate self-contained distribution
        run: npm run check:dist

      - name: Audit production dependencies
        run: npm run audit:ci

      # CycloneDX SBOM for the released artifact, generated with pinned,
      # reproducible tooling (npm's built-in `npm sbom`, no extra dependency).
      - name: Generate SBOM (CycloneDX)
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm run --silent sbom > "refrain-sheet-${VERSION}.sbom.cdx.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" \
            "refrain-sheet-${VERSION}.sbom.cdx.json"
          echo "SBOM bytes: $(wc -c < "refrain-sheet-${VERSION}.sbom.cdx.json")"

      # The site is fully static and self-contained (embedded WASM, relative
      # asset paths, no network) so the same dist/ that works from file:// also
      # works when served from https://<owner>.github.io/<repository>/. Only
      # upload it as the Pages artifact AFTER every check and the build above
      # have succeeded, so a broken build never reaches Pages.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Package release ZIP
        id: package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SHORT_HASH="$(git rev-parse --short HEAD)"
          ZIP_NAME="refrain-sheet-v${VERSION}-${SHORT_HASH}.zip"
          SBOM_NAME="refrain-sheet-${TAG}.sbom.cdx.json"
          STAGE="refrain-sheet-v${VERSION}"
          mkdir -p "stage/${STAGE}"
          cp -r dist/* "stage/${STAGE}/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "stage/${STAGE}/"
          cp "${SBOM_NAME}" "stage/${STAGE}/"
          (cd stage && zip -r "../${ZIP_NAME}" "${STAGE}")
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          cat "${ZIP_NAME}.sha256"
          {
            echo "zip_name=${ZIP_NAME}"
            echo "sbom_name=${SBOM_NAME}"
            echo "version=${VERSION}"
            echo "short_hash=${SHORT_HASH}"
          } >> "$GITHUB_OUTPUT"

      # Cryptographic build provenance for the release ZIP (SLSA-style), signed
      # via OIDC with no long-lived secret. Lets consumers verify the artifact
      # was built by this workflow from this repository:
      #   gh attestation verify <zip> --repo <owner>/<repo>
      - name: Attest build provenance for the release ZIP
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.zip_name }}

      - name: Write release notes
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SHORT_HASH: ${{ steps.package.outputs.short_hash }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          SBOM_NAME: ${{ steps.package.outputs.sbom_name }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # Refrain Sheet v${VERSION}

          - Version: ${VERSION}
          - Commit: ${SHORT_HASH}

          ## English

          A local-first, format-preserving CSV and spreadsheet editor. It runs fully
          offline from a single static HTML file — no installation, server, or network
          connection.

          ## 日本語

          ローカル環境で動作する、書式を保持する CSV・スプレッドシートエディタです。
          単一の静的 HTML ファイルから完全にオフラインで動作し、インストール・サーバー・
          ネットワーク接続はいずれも不要です。

          ## Verify the download / ダウンロードの検証

          \`\`\`sh
          sha256sum -c ${ZIP_NAME}.sha256
          \`\`\`

          Verify the build provenance attestation (requires the GitHub CLI):

          \`\`\`sh
          gh attestation verify ${ZIP_NAME} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## Supply-chain artifacts / サプライチェーン成果物

          - **English — SBOM:** \`${SBOM_NAME}\` (CycloneDX) lists the production
            dependency set. It is attached to this release and also bundled
            inside the ZIP. **Provenance:** a signed SLSA-style build-provenance
            attestation for the ZIP is published with this release.
          - **日本語 — SBOM:** \`${SBOM_NAME}\` (CycloneDX) に本番依存関係の一覧が
            含まれます。このリリースに添付され、ZIP にも同梱されています。
            **来歴 (Provenance):** ZIP に対する SLSA 形式の署名付きビルド来歴証明を
            このリリースで公開しています。

          ## How to use / 使い方

          ### English

          1. Download and extract \`${ZIP_NAME}\`.
          2. Open \`index.html\` directly in a browser (double-click, or
             drag it onto a browser window). No installation, server, or
             network connection is required — everything runs offline.
          3. Open CSV files via File > Open or drag & drop, edit cell
             values, and save.

          ### 日本語

          1. \`${ZIP_NAME}\` をダウンロードして展開します。
          2. \`index.html\` をブラウザで直接開きます (ダブルクリック、または
             ブラウザウィンドウにドラッグ)。インストール・サーバー・ネットワーク接続は
             不要で、すべてオフラインで動作します。
          3. File > Open またはドラッグ＆ドロップで CSV を開き、セルを編集して
             保存します。

          ## Save limitations under file:// and browser permissions / file:// での保存の制限

          ### English

          - In Chromium-based browsers, files opened through the file picker
            can usually be overwritten in place (File System Access API).
            The browser asks for write permission first.
          - Where the API is unavailable (Firefox, Safari, some file://
            contexts) or permission is denied, saving falls back to a
            **download**: the browser chooses the download location and the
            original file is NOT overwritten. The app tells you which kind
            of save happened.

          ### 日本語

          - Chromium 系ブラウザでは、ファイルピッカーで開いたファイルは通常その場で
            上書きできます (File System Access API)。上書き前にブラウザが書き込み
            許可を求めます。
          - この API が使えない場合 (Firefox、Safari、一部の file:// 環境) や許可が
            拒否された場合は、**ダウンロード**による保存に切り替わります。この場合は
            保存先をブラウザが決定し、元のファイルは上書きされません。どちらの方法で
            保存されたかはアプリが表示します。
          EOF

      - name: Create GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          SBOM_NAME: ${{ steps.package.outputs.sbom_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ZIP_NAME}" "${ZIP_NAME}.sha256" "${SBOM_NAME}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" "${ZIP_NAME}" "${ZIP_NAME}.sha256" "${SBOM_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Refrain Sheet ${TAG}" \
              --notes-file release-notes.md
          fi
          # Exposed as a job output so a caller can link the Release without
          # guessing its URL.
          echo "release_url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')" >>"$GITHUB_OUTPUT"

  # Publish the built dist/ to GitHub Pages. This runs ONLY after the release
  # job (tag validation + full verification suite + build + upload) succeeds, so
  # a broken or unchecked artifact is never deployed. It needs no secrets: the
  # official Pages actions authenticate with the run's GITHUB_TOKEN and OIDC.
  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    # Only the permissions the Pages deployment requires — no contents access.
    permissions:
      pages: write
      id-token: write
    # A named environment records the deployment and surfaces the live URL.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never run two Pages deployments at once, and never cancel one mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Expose the deployed site URL as a job output.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
