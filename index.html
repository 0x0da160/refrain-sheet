<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The policy is generated per build mode from scripts/csp.mjs — the
         single source of truth for both the offline and the hosted build — and
         substituted here by vite.config.ts. The two modes emit a byte-identical
         policy today; see docs/security.md. -->
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <!-- Brand accent green from the Refrain Sheet Design System v1.0.0
         (design-system/1.0.0/icons/site.webmanifest theme_color). Purely a
         mobile-browser-chrome tint; no manifest.json is shipped, since the
         app's offline/no-install identity stands regardless. -->
    <meta name="theme-color" content="#147F43" />
    <!-- SVG favicon copied verbatim from public/ to the dist root. The
         relative "/favicon.svg" reference is rewritten to "./favicon.svg" by
         Vite's base:'./' so it resolves under a GitHub Pages base path and when
         dist/index.html is opened directly via file://; no network request. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Refrain Sheet — A local-first, format-preserving CSV and spreadsheet editor</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Refrain Sheet requires JavaScript. It runs fully offline; no data leaves this page.</noscript>
  </body>
</html>
