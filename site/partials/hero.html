<!-- HERO: the Mist panel (.rb-feature, one per page) with the CSV demo:
     open a CSV, change one cell, save — only that cell changes. Drawn screens
     are allowed under the brand guidelines (D-42) only because they take every
     label from src/locales (data-app-i18n), every colour and size from the app
     tokens, and show only steps you can repeat in the app. The spreadsheet
     demo lives in features.html. -->
<section class="hero">
  <div class="rb-wrap">
    <div class="rb-feature hero-panel">
      <div class="hero-copy">
        <p class="hero-kicker" data-i18n="hero.eyebrow">ブラウザで開くだけ。無料・インストール不要</p>
        <h1 class="rb-display" data-i18n="hero.h1">CSVが壊れない軽い表計算ソフト</h1>
        <p class="rb-lead hero-lead" data-i18n="hero.lead">
          先頭の「0」も、文字コードも、改行コードも、開いたときのまま。数式やフィルタを使った集計もできます。データはパソコンの外に出ません。
        </p>
        <div class="rb-actions">
          <a
            class="rb-btn rb-btn--primary rb-btn--lg"
            data-i18n="hero.cta1"
            href="https://app.refrain-sheet.com/"
            rel="noopener"
            target="_blank"
            >ブラウザで開いてみる</a
          >
          <a
            class="rb-btn rb-btn--lg"
            data-i18n="hero.cta2"
            href="https://github.com/0x0da160/refrain-sheet/releases/"
            rel="noopener"
            target="_blank"
            >オフライン版をダウンロード</a
          >
        </div>
        <ul class="hero-badges">
          <li class="rb-badge" data-i18n="hero.badge1">Shift_JIS対応</li>
          <li class="rb-badge" data-i18n="hero.badge2">オフラインでも動く</li>
          <li class="rb-badge" data-i18n="hero.badge4">ログイン・アカウント登録不要</li>
          <li class="rb-badge" data-i18n="hero.badge3">オープンソース（MIT）</li>
        </ul>
      </div>

      <figure class="demo demo--csv" data-demo data-scene="4" data-scenes="4">
        <div aria-hidden="true" class="demo-app">
          <div class="app-menubar">
            <picture>
              <source
                media="(prefers-color-scheme: dark)"
                srcset="assets/refrain-sheet-logotype-horizontal-reverse.svg"
              />
              <img
                alt=""
                class="app-logo"
                height="16"
                src="assets/refrain-sheet-logotype-horizontal.svg"
                width="77"
              />
            </picture>
            <span data-app-i18n="menu.file"></span>
            <span data-app-i18n="menu.edit"></span>
            <span data-app-i18n="menu.search"></span>
            <span data-app-i18n="menu.sheet"></span>
            <span data-app-i18n="menu.format"></span>
            <span data-app-i18n="menu.data"></span>
            <span data-app-i18n="menu.view"></span>
            <span data-app-i18n="menu.help"></span>
          </div>
          <div class="app-tabs">
            <span class="app-tab">
              <svg class="app-icon only-s1" viewBox="0 0 16 16">
                <rect height="7" rx="1.5" width="10" x="3" y="7"></rect>
                <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path>
              </svg>
              <span class="app-dirty only-s3">●</span>
              <span data-i18n="demo.file.csv">uriage.csv</span>
              <span class="app-tab-close">×</span>
            </span>
          </div>
          <div class="app-fx">
            <span class="app-namebox"
              ><span class="only-s1">A1</span><span class="only-s2">D3</span
              ><span class="only-s34">D4</span></span
            >
            <span class="app-fx-input"
              ><span class="only-s1" data-i18n="demo.csv.h.code">商品コード</span
              ><span class="only-s2" data-i18n="demo.csv.old">在庫僅少</span></span
            >
          </div>
          <div class="app-grid app-grid--csv">
            <span class="gh gh-corner"></span>
            <span class="gh gh-col col-a">A</span>
            <span class="gh gh-col">B</span>
            <span class="gh gh-col">C</span>
            <span class="gh gh-col col-d">D</span>

            <span class="gh gh-row row-1">1</span>
            <span class="gc cell-a1" data-i18n="demo.csv.h.code">商品コード</span>
            <span class="gc row1" data-i18n="demo.h.name">商品名</span>
            <span class="gc row1" data-i18n="demo.h.qty">数量</span>
            <span class="gc row1" data-i18n="demo.csv.h.note">備考</span>

            <span class="gh gh-row">2</span>
            <span class="gc">0012</span>
            <span class="gc" data-i18n="demo.r1">抹茶 ラテベース</span>
            <span class="gc">20</span>
            <span class="gc"></span>

            <span class="gh gh-row row-3">3</span>
            <span class="gc row3">0034</span>
            <span class="gc row3" data-i18n="demo.r2">抹茶 セレモニアル</span>
            <span class="gc row3">12</span>
            <span class="gc row3 cell-d3"
              ><span class="only-s1" data-i18n="demo.csv.old">在庫僅少</span
              ><span class="only-s2 app-typed" data-i18n="demo.csv.new">要発注</span
              ><span class="only-s34" data-i18n="demo.csv.new">要発注</span></span
            >

            <span class="gh gh-row row-4">4</span>
            <span class="gc row4">0056</span>
            <span class="gc row4" data-i18n="demo.r3">ほうじ茶 パウダー</span>
            <span class="gc row4">30</span>
            <span class="gc row4 cell-d4"></span>
          </div>
          <div class="app-status">
            <span data-app-i18n="status.doc.csv"></span>
            <span class="only-s1 st-protected"
              ><svg class="app-icon" viewBox="0 0 16 16">
                <rect height="7" rx="1.5" width="10" x="3" y="7"></rect>
                <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg
              ><span data-app-i18n="status.protected"></span
            ></span>
            <span class="only-s1 st-toggle"
              ><svg class="app-icon" viewBox="0 0 16 16">
                <rect height="7" rx="1.5" width="10" x="3" y="7"></rect>
                <path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"></path></svg
              ><span data-app-i18n="status.protect.edit"></span
            ></span>
            <span class="not-s1 st-toggle"
              ><svg class="app-icon" viewBox="0 0 16 16">
                <rect height="7" rx="1.5" width="10" x="3" y="7"></rect>
                <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg
              ><span data-app-i18n="status.protect.protect"></span
            ></span>
            <span
              ><span data-app-i18n="status.encoding"></span>: <span data-app-i18n="encoding.shift_jis"></span
            ></span>
            <span><span data-app-i18n="status.lineEndings"></span>: CRLF</span>
            <span class="only-s3" data-app-i18n="status.edits" data-app-i18n-args='{"n":"demo.n1"}'></span>
          </div>

          <div class="app-toast only-s4" data-app-i18n="notify.savedOverwrite"></div>
        </div>

        <figcaption class="demo-caption">
          <ol class="demo-steps">
            <li data-step="1" data-i18n="demo.csv.step1">
              Shift_JIS・CRLF のCSVを開く（最初は保護された状態）
            </li>
            <li data-step="2" data-i18n="demo.csv.step2">保護を外して、1つのセルを書き換える</li>
            <li data-step="3" data-i18n="demo.csv.step3">直したセルだけに色がつく</li>
            <li data-step="4" data-i18n="demo.csv.step4">上書き保存。変わったのは、直したセルだけ</li>
          </ol>
          <button class="demo-toggle" data-demo-toggle hidden type="button">
            <span class="demo-toggle-pause" data-i18n="demo.pause">デモを一時停止</span>
            <span class="demo-toggle-play" data-i18n="demo.play">デモを再生</span>
          </button>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
