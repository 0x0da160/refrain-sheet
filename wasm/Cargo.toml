[package]
name = "refrain-csv-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Byte-level CSV core (parsing, validation, sniffing, indexing, serialization planning) for Refrain Sheet, compiled to WebAssembly."
repository = "https://github.com/0x0da160/refrain-sheet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: wasm-pack downloads the matching wasm-bindgen-cli, so the
# crate version must stay deterministic.
wasm-bindgen = "=0.2.129"
# Pure-Rust compression codecs for the binary .rsf container. All three build
# cleanly for wasm32-unknown-unknown with no C/C++ toolchain (unlike the `zstd`
# crate, whose zstd-sys needs cc). The container records a method id per file
# so any method can be added without breaking older files.
#
#   DEFLATE (RFC 1951)  -> miniz_oxide  (compatibility fallback, method 0x01)
#   Zstandard           -> ruzstd       (default, method 0x02; encoder + decoder)
#   LZ4 Frame           -> lz4_flex     (speed option, method 0x03)
miniz_oxide = "=0.9.1"
# ruzstd provides a pure-Rust Zstandard encoder (ruzstd::encoding) and decoder
# (ruzstd::decoding); no libzstd / C toolchain. Pinned for reproducible builds.
# 0.9.x needs Rust 1.87+ (rust-toolchain.toml). The frozen .rsf fixtures
# (tests/core/rsf-fixtures.test.ts) pin the encoder's output byte-for-byte, so a
# bump that changes the compressed bytes fails there before it can ship.
# Moved to 0.9.1. It changes the compressed bytes, so the frozen fixtures keep
# their 0.9.0 output for the decode check, and the 0.9.1 output is pinned by
# the ruzstd-0-9-1 fixtures (see tests/core/rsf-fixtures.test.ts).
ruzstd = "=0.9.1"
# lz4_flex: pure-Rust LZ4 with the Frame format (frame feature, default on).
lz4_flex = "=0.14.0"
# Argon2id key derivation for the encrypted `.rsf` container (RFC 9106, version
# 0x13). Pinned exactly. Default features are off: only the `alloc` feature is
# needed, and no RNG, thread pool, or secret/associated data is used because
# salts are passed in from JavaScript. AES-256-GCM runs in the browser through
# WebCrypto, so no cipher crate is added here.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }

[profile.release]
# Measured against opt-level = "s" (see #80): "3" is both faster (~10-35% across bench/perf.bench.ts's wasm-bound cases) and smaller here (~2.4% less embedded Base64), so there is no size/speed trade-off to record beyond this.
opt-level = 3
lto = true
codegen-units = 1

# wasm-opt is disabled so the Docker/CI build never downloads binaryen at
# build time; the size cost is small and documented in the README.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
