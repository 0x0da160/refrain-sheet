<div class="cookie-consent" hidden id="cookie-consent" data-theme="dark" role="region">
  <div class="cookie-consent-inner">
    <p class="cookie-consent-text" data-i18n="consent.text">
      このページ（refrain-sheet.com）は、訪問状況の把握のために Google Analytics
      を利用します。同意した場合のみ読み込まれ、いつでも取り消せます。CSVを編集するアプリ本体（app.refrain-sheet.com）にアクセス解析は含まれません。
    </p>
    <div class="cookie-consent-actions">
      <button class="rb-btn" data-consent-action="decline" data-i18n="consent.decline" type="button">
        同意しない
      </button>
      <button
        class="rb-btn rb-btn--primary"
        data-consent-action="accept"
        data-i18n="consent.accept"
        type="button"
      >
        同意する
      </button>
    </div>
  </div>
</div>
