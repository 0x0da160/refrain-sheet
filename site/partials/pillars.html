<!-- PILLARS: the three promises the rest of the page proves. -->
<section aria-label="Refrain Sheet" class="pillars">
  <div class="rb-wrap rb-cards">
    <div class="rb-card">
      <h2 class="rb-h3" data-i18n="pillars.p1h">CSVを壊さない</h2>
      <p data-i18n="pillars.p1p">
        先頭の「0」も、文字コードも、改行コードも、開いたときのまま。変わるのは、直したセルだけです。
      </p>
    </div>
    <div class="rb-card">
      <h2 class="rb-h3" data-i18n="pillars.p2h">表計算ソフトとして使える</h2>
      <p data-i18n="pillars.p2p">
        数式、フィルタ、条件付き書式、複数のシート。よく使う機能に絞った、軽い表計算ソフトです。
      </p>
    </div>
    <div class="rb-card">
      <h2 class="rb-h3" data-i18n="pillars.p3h">データを外に出さない</h2>
      <p data-i18n="pillars.p3p">
        ブラウザの中だけで動くので、ファイルをサーバーに送る必要がありません。1つのHTMLファイルで、オフラインでも使えます。
      </p>
    </div>
  </div>
</section>
