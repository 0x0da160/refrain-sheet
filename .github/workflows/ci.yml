name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. CI never creates releases, publishes packages, deploys
# Pages, or modifies the repository, so pull requests from forks run with no
# write access and no access to secrets. No job widens these permissions.
permissions:
  contents: read

# Supersede, don't queue. Pushing several commits to the same pull request in
# quick succession used to leave every older run going to completion, holding
# runners and delaying the run that actually matters. Grouping by ref makes a
# newer commit cancel the stale run for that same ref.
#
# `github.ref` is already unique per pull request (`refs/pull/<n>/merge`), so it
# needs no separate PR key. Cancellation is deliberately limited to
# `pull_request`: on a push to `main` each commit keeps its own CI result and
# its `refrain-sheet-dist` artifact, rather than a fast second merge erasing the
# first commit's only verification signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Action-pinning policy (see knowledge/operations/security-supply-chain.md): only official GitHub-maintained
# actions/* are used here, pinned to a major version tag. Any third-party (non
# actions/*) action MUST instead be pinned to a full commit SHA. There are
# currently no third-party actions in this workflow.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Depth 2 so the changelog gate can see the merge commit's first parent
      # (the base branch tip) and derive the pull request's own diff from it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci --ignore-scripts` reproduces node_modules strictly from the
      # committed lockfile and fails if package.json and package-lock.json
      # disagree, so it doubles as lockfile-integrity validation, while
      # blocking dependency lifecycle scripts (a primary supply-chain vector).
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Version consistency
        run: npm run check:versions

      # Every knowledge/ concept file (see knowledge/index.md) must carry
      # parseable OKF v0.2 frontmatter with a non-empty `type`; the bundle's
      # reserved index.md/log.md files must carry none — see
      # scripts/check-knowledge-frontmatter.mjs.
      - name: Knowledge bundle frontmatter
        run: npm run check:knowledge

      # CHANGELOG.md stopped being updated for nine releases because nothing
      # asked for it (Issue #178). This fails a pull request that changes
      # application source without a changelog entry; a genuinely internal
      # change says so with `Changelog: not-needed` in its description. Only
      # meaningful on `pull_request` — there is no pull request to inspect on a
      # push, and the gate already ran before the merge.
      - name: Changelog entry
        if: github.event_name == 'pull_request'
        run: npm run check:changelog

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Unused exports/files/dependencies (Knip). Fails on any finding not on
      # scripts/check-knip.mjs's explicit, human-review-pending DEFERRED list,
      # and on a deferred entry that has since been resolved — see
      # docs/knip-baseline.md.
      - name: Unused code
        run: npm run check:knip

      # Verifies the Oklch-authored color system's actual declared tokens
      # (src/styles.css) meet WCAG AA contrast for every text/background pair
      # that composes in the UI, in every theme — see scripts/check-contrast.mjs.
      - name: Contrast check
        run: npm run check:contrast

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate self-contained distribution
        run: npm run check:dist

      # The hosted artifact (app.refrain-sheet.com) is built from the same
      # sources and differs only in its Content-Security-Policy, which
      # scripts/csp.mjs emits per mode. The two policies are byte-identical
      # today; building and validating both here is what stops a future
      # hosted-only relaxation from ever reaching the offline dist/ that ships
      # in the release ZIP. See knowledge/operations/security-supply-chain.md.
      # Mirrors the release build. A pull request from a fork sees an empty
      # variable and simply builds without Drive sync, which must also work —
      # only the release path requires the credential to be present.
      - name: Build (hosted)
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_DRIVE_API_KEY: ${{ vars.GOOGLE_DRIVE_API_KEY }}
        run: npm run build:hosted

      - name: Validate hosted distribution
        run: npm run check:dist:hosted

      # Vulnerability gate. Network-dependent (queries the advisory DB), so it
      # is one of several gates, never the only one — the lockfile-integrity
      # install, version-consistency, and clean-tree checks do not need the
      # network. Fails the build on a known high/critical advisory in a
      # production dependency.
      - name: Audit production dependencies
        run: npm run audit:ci

      # Nothing above may leave a tracked file modified: a drifting lockfile, a
      # generated artifact committed by mistake, or a formatter/codegen side
      # effect would all show up here and fail the build.
      - name: Ensure the working tree is clean after install/build/test
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tracked files changed during CI:" >&2
            git status --porcelain >&2
            git diff >&2
            exit 1
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: refrain-sheet-dist
          path: dist/
          if-no-files-found: error
